<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#0E357F">
<meta name="color-scheme" content="light">
<title>Friendship Store — สั่งซื้อสินค้า HORECA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:light;   /* กัน night mode มือถือ (force-dark) กลับสีหน้าเป็นดำ */
  /* ธีม Makro: ขาว / น้ำเงิน / แดง — remap ชื่อตัวแปรเดิม (green=น้ำเงิน, amber=แดง, purple=น้ำเงิน) */
  --green:#0E357F; --green-d:#0A2A66; --green-l:#E7F0FB;
  --amber:#E1121D; --amber-d:#B70E17;
  --purple:#1461C4; --purple-l:#E7F0FB;
  --red:#E1121D; --red-l:#FDECEC;
  --blue:#1461C4; --blue-l:#E7F0FB; --navy:#0A2A66;
  --ink:#16233B; --muted:#6A7488; --line:#E3E7EE; --line-2:#D5DBE5;
  --bg:#EEF1F5; --card:#FFFFFF;
  --ok:#16A34A; --warn:#E1121D;
  --sh:0 1px 3px rgba(16,40,30,.06),0 1px 2px rgba(16,40,30,.04);
  --sh-lg:0 8px 30px rgba(16,40,30,.12);
  --r:14px; --r-sm:10px;
  --hdr:56px; --nav:60px;
  --ff:'Segoe UI',-apple-system,'Noto Sans Thai','Noto Sans Lao','Sarabun',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff}
body{font-family:var(--ff);background:#fff;color:var(--ink);font-size:14px;line-height:1.45;overscroll-behavior-y:none}
img{max-width:100%;display:block}
svg{width:20px;height:20px;flex-shrink:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

/* ---------- App shell ---------- */
#app{min-height:100%;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
@media(min-width:820px){#app{padding-bottom:24px}}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:#fff;color:var(--ink);box-shadow:0 1px 8px rgba(16,40,30,.10);border-bottom:1px solid var(--line)}
.hbar{height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 12px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;height:100%;cursor:pointer;flex-shrink:0}
.logo-img{height:36px;width:auto;display:block}
.logo-icon{display:none}
@media(max-width:819px){.logo-full{display:none}.logo-icon{display:block;height:38px}}  /* มือถือ = ไอคอนคน 4 คน · เว็บ = โลโก้เต็มมีตัวอักษร */
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line-2);color:var(--ink);border-radius:10px;padding:0 12px;height:38px;min-width:0}
.search svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.search input{border:none;outline:none;flex:1;min-width:0;background:none}
.sbtn{width:28px;height:28px;display:grid;place-items:center;color:var(--green);flex-shrink:0;cursor:pointer;border-radius:8px;background:none;padding:0}
.sbtn:active{background:var(--green-l)}
.sbtn svg{width:19px;height:19px}
.sbtn.rec{color:#fff;background:var(--red);animation:recpulse 1s infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.55}}
/* voice-search language picker (ภาษาพูด) */
.langbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 14px 3px}
.lb-voice{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.vb-lbl{font-size:10.5px;color:var(--muted);font-weight:800}
/* display-language slide switch (สลับภาษาแสดงผล) */
.langslide{position:relative;display:inline-flex;background:var(--bg);border:1.5px solid var(--line-2);border-radius:999px;overflow:hidden;flex-shrink:0}
.ls-knob{position:absolute;top:0;bottom:0;left:0;width:50%;border-radius:999px;background:var(--blue);transition:transform .22s ease;z-index:0}
.ls-opt{position:relative;z-index:1;flex:1;min-width:46px;text-align:center;border:none;background:none;font-size:11.5px;font-weight:800;padding:6px 14px;color:var(--muted);cursor:pointer;transition:color .2s}
.ls-opt.on{color:#fff}
.vchip{border:1.5px solid var(--line-2);background:var(--card);color:var(--muted);border-radius:11px;padding:3px 12px;font-size:11px;font-weight:800;cursor:pointer;margin-right:2px}
.vchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.htools{display:flex;align-items:center;gap:4px}
@media(max-width:819px){.htools{display:none}}  /* มือถือ: บัญชี/ตะกร้าอยู่แถบล่างแล้ว → เหลือโลโก้+ค้นหาเต็มแถว */
.hmenu{display:flex;align-items:center;justify-content:center;width:34px;height:38px;color:var(--green);flex-shrink:0;background:none;border:none;cursor:pointer;padding:0}
.hmenu svg{width:23px;height:23px}
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:340px;background:#fff;z-index:61;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dw-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dw-top img{height:34px;width:auto}
.dw-x{width:34px;height:34px;border:none;background:var(--bg);border-radius:9px;font-size:18px;color:var(--ink);cursor:pointer}
.dw-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;color:var(--ink);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.dw-item:active{background:var(--bg)}
.dw-item svg{width:20px;height:20px;color:var(--green);flex-shrink:0}
.dw-item .chev{margin-left:auto;color:var(--muted)}
.dw-item .chev svg{width:16px;height:16px;color:var(--muted)}
.dw-sec{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;padding:14px 18px 6px}
.dw-item .chev.rot{transform:rotate(90deg)}
.dw-sub{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 18px 11px 52px;border:none;border-bottom:1px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--ink);cursor:pointer}
.dw-sub:active{background:var(--line)}
.dw-sub .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.hbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--green);transition:background .15s}
.hbtn:hover{background:var(--bg)}
.hbtn svg{width:21px;height:21px}
.hbadge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:1.5px solid #fff}
.langpill{font-size:12px;font-weight:800;padding:0 8px;height:30px;border-radius:8px;background:var(--green-l);color:var(--green);display:grid;place-items:center}
.promo-strip{background:var(--red);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:5px 12px;display:flex;align-items:center;justify-content:center;gap:6px}
.promo-strip b{color:var(--amber)}

/* ---------- Category chips ---------- */
.catbar{position:sticky;top:var(--hdr);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.catbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
.catdd{display:flex;align-items:center;gap:7px;background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:9px 13px;border-radius:10px;white-space:nowrap;flex-shrink:0;box-shadow:var(--sh)}
.catdd svg{width:17px;height:17px}
.catdd .cv{opacity:.85}
.catchips{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:2px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line-2);font-size:13px;font-weight:700;color:var(--muted);transition:.15s;flex-shrink:0}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
/* category mega-menu */
.catmenu{display:flex;flex-direction:column}
.catmenu-item{display:flex;align-items:center;gap:13px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s}
.catmenu-item:hover{background:var(--bg)}
.catmenu-item.on{background:var(--blue-l)}
.cati{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.catl{flex:1;font-weight:700;font-size:14px;color:var(--ink)}
.catl small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.catchev{color:var(--muted);transition:transform .15s}.catchev svg{width:18px;height:18px}
/* กลุ่มย่อยในเมนู (accordion) */
.catsub{display:flex;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line)}
.catsub-item{text-align:left;padding:10px 14px 10px 52px;font-size:13px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line)}
.catsub-item:last-child{border-bottom:none}
.catsub-item small{color:var(--muted);font-weight:600;margin-left:3px}
.catsub-item.on{color:var(--blue);background:var(--blue-l)}
/* แถบชิปกลุ่มย่อยบนหน้าหมวด */
.grpbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.grp-chip{white-space:nowrap;padding:6px 14px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--muted);flex-shrink:0;scroll-snap-align:start}
.grp-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- Layout container ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:14px 12px}
.sec-title{font-size:16px;font-weight:800;margin:6px 2px 12px;display:flex;align-items:center;gap:8px}
.sec-title .bar{width:4px;height:18px;border-radius:2px;background:var(--amber)}

/* ---------- Product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(5,1fr)}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .12s}
/* มือถือเก่าลื่นขึ้น: ข้าม render/decode การ์ดนอกจอ (content-visibility) + shadow เบาลง */
.grid>.pcard{content-visibility:auto;contain-intrinsic-size:auto 300px}
@media(max-width:819px){.pcard{box-shadow:0 1px 2px rgba(16,40,30,.05)}}
.pcard.promo-framed{border:2px solid var(--pc,#E1121D);box-shadow:0 3px 12px rgba(225,18,29,.14)}
.promo-tag{background:var(--pc,#E1121D);color:#fff;font-size:10px;font-weight:800;text-align:center;padding:4px 8px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-art{width:100%;border-radius:14px;margin-bottom:12px;box-shadow:var(--sh);display:block}
.promo-block{margin-bottom:24px}
.promo-top{height:23px;line-height:23px;background:transparent;color:#fff;font-size:10px;font-weight:800;text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;flex-shrink:0}
.promo-sort{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 2px 14px}
.ps-lbl{font-size:12px;color:var(--muted);font-weight:800}
.ps-chip{border:1.5px solid var(--line-2);background:var(--card);color:var(--muted);border-radius:14px;padding:5px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.ps-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.promo-cat{margin-bottom:14px}
.promo-cat-h{font-size:13px;font-weight:800;color:var(--ink);margin:2px 2px 8px;display:flex;align-items:center;gap:6px}
.promo-cat-h span{color:var(--muted);font-weight:600;font-size:12px}
/* campaign selector chips (เลือกดูแต่ละโปร) */
.promo-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ptab{flex:0 0 auto;scroll-snap-align:start;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:800;white-space:nowrap;transition:.12s}
.ptab.on{background:var(--pc,var(--red));border-color:var(--pc,var(--red));color:#fff;box-shadow:0 3px 10px rgba(225,18,29,.28)}
.pcard:active{transform:scale(.98)}
.pthumb{position:relative;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.pthumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.pthumb .ph{font-size:34px;font-weight:900;color:#c3ccc7}
.pframe{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:1}
.pstock{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--green-d);background:var(--green-l);border-radius:6px;padding:2px 7px;align-self:flex-start;margin-top:1px}
.pstock svg{width:13px;height:13px}
.pstock.out{color:var(--red);background:#FDECEC}
.plabels{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:1px}
.plabel{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;line-height:1.35}
.pbadge{position:absolute;top:7px;left:7px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;box-shadow:var(--sh)}
.pbody{padding:9px 10px 11px;display:flex;flex-direction:column;flex:1;gap:5px}
.pcat{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.4px}
.pbc{color:var(--muted);text-transform:none;letter-spacing:.5px;font-weight:600;font-family:'Consolas','Menlo',monospace}
.pname{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pprice{margin-top:auto;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pprice .now{font-size:16px;font-weight:900;color:var(--red)}
.pprice .was{font-size:11px;color:var(--muted);text-decoration:line-through}
.punit{font-size:10.5px;color:var(--muted);text-align:right}
/* circular add button on image corner */
.padd-fab{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 3px 9px rgba(225,18,29,.42);z-index:2;transition:transform .12s,background .12s}
.padd-fab:hover{background:var(--red-d,#B70E17)}
.padd-fab:active{transform:scale(.9)}
.padd-fab svg{width:20px;height:20px}
/* promo limited-quantity bar */
.limbar{margin:3px 0 1px}
.limbar-track{height:7px;border-radius:4px;background:#F7D9D7;overflow:hidden}
.limbar-fill{height:100%;background:linear-gradient(90deg,#F5A623,#E1121D);border-radius:4px}
.limbar-lbl{font-size:9.5px;font-weight:800;color:var(--red);margin-top:2px;letter-spacing:.2px}
/* HORECA-style card: SAVE flag + price box + favorite heart */
.save-flag{position:absolute;top:0;left:9px;z-index:2;background:var(--red);color:#fff;padding:5px 8px 12px;text-align:center;line-height:1;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);box-shadow:0 3px 7px rgba(225,18,29,.4)}
.save-flag .sf-s{font-size:8px;font-weight:700;letter-spacing:1.5px}
.save-flag .sf-p{font-size:13px;font-weight:900;margin-top:1px}
.save-flag .sf-t{font-size:10px;font-weight:900}
.price-box{margin-top:auto;padding-top:6px;text-align:right}
.p-unit{font-size:11px;font-weight:800;color:#7c3aed;line-height:1}
.p-was{font-size:11px;color:#aab6ca;text-decoration:line-through;line-height:1.4}
.p-now{font-size:17px;font-weight:900;color:var(--red);line-height:1.05}
.p-now.plain{color:var(--ink)}
.fav-btn{position:absolute;top:6px;right:6px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.15);border:none;padding:0}
.fav-btn .off{filter:grayscale(1);opacity:.42}
/* home category sections (Makro-style horizontal rows) */
.home-sec{margin-bottom:18px;content-visibility:auto;contain-intrinsic-size:auto 340px}
.home-sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.hsh-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;min-width:0}
.hsh-n{font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.see-all{display:flex;align-items:center;gap:1px;font-size:12.5px;font-weight:800;color:var(--green);white-space:nowrap;flex-shrink:0}
.see-all svg{width:16px;height:16px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:0 0 8px;scroll-snap-type:x proximity}
.hrow>.pcard{flex:0 0 158px;width:158px;scroll-snap-align:start}
.hrow-more{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1.5px dashed var(--line-2);border-radius:var(--r);color:var(--green);font-size:12px;font-weight:800;cursor:pointer}
.hrow-more svg{width:24px;height:24px}
.back-mini{width:26px;height:26px;border-radius:8px;background:var(--bg);display:inline-grid;place-items:center;margin-right:2px;vertical-align:middle}
.back-mini svg{width:17px;height:17px}
.sec-title .back-mini+*{vertical-align:middle}
/* out of stock */
.pcard.oos .pthumb img,.pcard.oos .pthumb .ph{opacity:.5;filter:grayscale(.6)}
.pcard.oos .pname,.pcard.oos .price-box{opacity:.6}
.oos-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:rgba(22,35,59,.82);color:#fff;font-size:12px;font-weight:800;padding:6px 14px;border-radius:8px;white-space:nowrap}
.padd{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--amber);color:#fff;font-weight:800;font-size:12.5px;height:34px;border-radius:9px;transition:.15s}
.padd:hover{background:var(--amber-d);color:#fff}
.padd svg{width:15px;height:15px}
/* qty stepper on card */
.stepper{margin-top:7px;display:flex;align-items:center;height:34px;border-radius:9px;overflow:hidden;border:1.5px solid var(--green)}
.stepper button{width:34px;height:100%;background:var(--green-l);color:var(--green-d);font-size:18px;font-weight:800;display:grid;place-items:center}
.stepper .q{flex:1;text-align:center;font-weight:800;color:var(--ink)}

/* ---------- Empty / loading ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ico{font-size:44px;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.skel{background:linear-gradient(90deg,#eef1f0,#f6f8f7,#eef1f0);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);aspect-ratio:.72}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- Bottom nav ---------- */
nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(16,40,30,.06)}
nav.bn button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;position:relative}
nav.bn button.on{color:var(--green)}
nav.bn button svg{width:22px;height:22px}
nav.bn .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
@media(min-width:820px){nav.bn{display:none}}

/* ---------- Cart / pages ---------- */
.page-h{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.page-h .back{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--bg)}
.page-h .back svg{width:20px;height:20px}
.page-h h2{font-size:16px;font-weight:800}
.line-item{display:flex;gap:11px;padding:12px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh)}
.line-item .th{width:64px;height:64px;border-radius:10px;background:#eef2f0;flex-shrink:0;display:grid;place-items:center;overflow:hidden}
.line-item .th img{width:100%;height:100%;object-fit:contain}
.line-item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.line-item .nm{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-item .um{font-size:11px;color:var(--muted)}
.line-item .pr{font-size:14px;font-weight:900;color:var(--red)}
.li-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}
.trash{color:var(--muted)}.trash svg{width:18px;height:18px}
.stepper.sm{height:30px;width:104px}
.stepper.sm button{width:30px;font-size:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:11px 12px;outline:none;background:#fff;transition:border .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green)}
.field textarea{min-height:74px;resize:vertical}
.seg{display:flex;gap:8px}
.seg .opt{flex:1;border:1.5px solid var(--line-2);border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:13px;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:5px}
.seg .opt svg{width:22px;height:22px;color:var(--muted)}
.seg .opt.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.seg .opt.on svg{color:var(--green)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:800;transition:.15s}
.btn-p{background:var(--amber);color:#fff}.btn-p:hover{background:var(--amber-d);color:#fff}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--green-d)}
.btn-o{background:#fff;border:1.5px solid var(--line-2);color:var(--ink)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn svg{width:19px;height:19px}

/* sticky checkout footer */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:44;background:var(--card);border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px rgba(16,40,30,.08)}
.foot-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .tot{flex:1}
.foot .tot small{font-size:11px;color:var(--muted);display:block}
.foot .tot b{font-size:20px;font-weight:900;color:var(--red)}
.foot .btn{width:auto;flex:1.4;padding:0 22px}

/* summary rows */
.sum{font-size:13.5px}
.sum .r{display:flex;justify-content:space-between;padding:5px 0;color:var(--muted)}
.sum .r b{color:var(--ink);font-weight:700}
.sum .grand{border-top:1px dashed var(--line-2);margin-top:6px;padding-top:10px;font-size:15px}
.sum .grand b{font-size:19px;font-weight:900;color:var(--red)}

/* status badge */
.stbadge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap}

/* points banner */
.ptsban{background:linear-gradient(120deg,var(--blue),var(--navy));color:#fff;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(20,97,196,.28)}
.ptsban .pv{font-size:30px;font-weight:900;line-height:1}
.ptsban small{opacity:.9;font-size:12px}

/* flash-sale hero (Promotion tab) */
.flashhero{background:linear-gradient(100deg,#8F0B12,#E1121D 55%,#F5A623);border-radius:16px;padding:15px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px rgba(225,18,29,.32);margin-bottom:14px;position:relative;overflow:hidden}
.flashhero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.fh-left{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.fh-bolt{font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.fh-t2{font-size:22px;font-weight:900;letter-spacing:1.5px;line-height:1}
.fh-t1{font-size:12px;font-weight:600;opacity:.95;margin-top:3px}
.fh-timer{text-align:center;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;position:relative;z-index:1;flex-shrink:0}
.fh-lbl{font-size:10px;opacity:.9;margin-bottom:3px}
.fh-clock{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1.5px}
/* custom uploaded promo banner (แทนแถบ Flash Sale) */
.promo-hero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.promo-hero img{width:100%;display:block}
.promo-hero-timer{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);color:#fff;padding:6px 13px;border-radius:12px}
.promo-hero-timer .pht-lbl{font-size:10px;opacity:.92}
/* hero carousel โปรโมชั่น (เลื่อนซ้าย-ขวา เปลี่ยนโปร) */
.phero{position:relative;margin-bottom:12px}
.phero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border-radius:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.phero-track::-webkit-scrollbar{display:none}
.phero-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;cursor:pointer;min-width:0}
.phero-slide img{width:100%;display:block;border-radius:16px}
.phero-fallback{height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:0 18px}
.phero-fallback .phf-t{font-size:19px;font-weight:800;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.phero-fallback .phf-n{font-size:12px;font-weight:700;opacity:.92;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:20px}
.phero-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 11px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-weight:800;font-size:15px;border-radius:0 0 16px 16px;pointer-events:none}
.phero-arrow{position:absolute;top:calc(50% - 6px);transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;cursor:pointer;z-index:3;padding-bottom:3px}
.phero-arrow.l{left:8px}
.phero-arrow.r{right:8px}
.phero-dots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.phero-dot{width:7px;height:7px;border-radius:50%;background:var(--line,#d5dbe0);border:none;padding:0;cursor:pointer;transition:width .2s,background .2s}
.phero-dot.on{background:#E1121D;width:20px;border-radius:4px}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(16,30,24,.6);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:560px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:up .25s ease}
@media(min-width:560px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:var(--card)}
.sheet-h h3{font-size:17px;font-weight:800}
.sheet-h .x{width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center}
.sheet-b{padding:6px 18px 22px}

.tabs{display:flex;background:var(--bg);border-radius:11px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:800;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--green-d);box-shadow:var(--sh)}

/* product detail */
.pd-img{background:#fff;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;padding:14px;min-height:240px}
.pd-img img{max-width:100%;max-height:56vh;width:auto;height:auto;object-fit:contain;display:block}
.uopt{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 13px;margin-bottom:9px;transition:.15s}
.uopt.on{border-color:var(--green);background:var(--green-l)}
.uopt .ul{font-weight:700;font-size:13.5px}
.uopt .ul small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.uopt .up{font-weight:900;color:var(--red);font-size:15px}
.uopt .up .m{display:block;font-size:10.5px;font-weight:700;color:var(--purple);text-align:right}
/* related products in detail sheet */
.rel-sec{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}
.rel-title{font-size:14px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.rel-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--red)}
.rel-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px}
.rel-card{flex:0 0 116px;width:116px;cursor:pointer}
.rel-thumb{aspect-ratio:1;background:linear-gradient(135deg,#f0f3f1,#e4eae7);border-radius:10px;overflow:hidden;display:grid;place-items:center;margin-bottom:6px}
.rel-thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
.rel-ph{font-size:28px;font-weight:900;color:#c3ccc7}
.rel-nm{font-size:11.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.rel-pr{font-size:13px;font-weight:900;color:var(--red);margin-top:3px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg);animation:tin .2s;max-width:88vw}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--warn)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.slip-drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);background:var(--bg)}
.slip-drop svg{width:34px;height:34px;color:var(--green);margin-bottom:8px}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--sh)}
.qrbox img{width:220px;max-width:70%;margin:0 auto;border-radius:10px}
.qrph{width:210px;height:210px;margin:0 auto;border:2px dashed var(--line-2);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:12px;padding:16px;text-align:center}
</style>
</head>

</div>

/* ---------- Pricing ---------- */
function unitPrice(p){const promo=Number(p.promo_price)||0;const nrm=Number(p.normal_price)||0;return promo>0?promo:nrm;}
function unitWas(p){const promo=Number(p.promo_price)||0;const nrm=Number(p.normal_price)||0;return (promo>0&&nrm>promo)?nrm:0;}
function packPrice(p){const promo=Number(p.pack_promo)||0;const nrm=Number(p.pack_normal)||0;return promo>0?promo:nrm;}
function packWas(p){const promo=Number(p.pack_promo)||0;const nrm=Number(p.pack_normal)||0;return (promo>0&&nrm>promo)?nrm:0;}
function boxPrice(p){const promo=Number(p.box_promo)||0;const nrm=Number(p.box_normal)||0;return promo>0?promo:nrm;}
function boxWas(p){const promo=Number(p.box_promo)||0;const nrm=Number(p.box_normal)||0;return (promo>0&&nrm>promo)?nrm:0;}
function priceFor(p,ut){return ut==='box'?boxPrice(p):ut==='pack'?packPrice(p):unitPrice(p);}
function isPromoLine(p,ut){
  if(ut==='box')return Number(p.box_promo)>0&&Number(p.box_normal)>Number(p.box_promo);
  if(ut==='pack')return Number(p.pack_promo)>0&&Number(p.pack_normal)>Number(p.pack_promo);
  return unitWas(p)>0;
}
const POINT_PER=10000;   // 10,000 kip = 1 แต้ม
function eligibleSubtotal(){return cart.reduce((s,i)=>{const p=PMAP[i.barcode];if(!p||isPromoLine(p,i.unit_type))return s;return s+priceFor(p,i.unit_type)*i.qty;},0);}
function pointsEarn(){return Math.floor(eligibleSubtotal()/POINT_PER);}
function labelFor(p,ut){if(ut==='box')return T('box');if(ut==='pack')return p.pack_label||T('pack');return p.unit||T('unit');}

// หมวดที่ซ่อนจากลูกค้า (เลิกขาย) — หมวด 24 หรือมีคำว่ายกเลิก
function isHiddenCat(c){const s=String(c||'');return /^\s*24\s*[-.]/.test(s)||/ຍົກເລີກ|ຍົກເລິກ|ยกเลิก|ຊັບສີນ|ຊັບສິນ|ซับซิน|ทรัพย์สิน/.test(s);}
let catalogError='';
async function loadCatalog(attempt){
  attempt=attempt||1;
  try{
    let all=[],from=0;const page=1000;
    while(true){
      const {data,error}=await sb.from('v_store_catalog').select('*').order('sort_order',{ascending:true,nullsFirst:false}).order('product_name').range(from,from+page-1);
      if(error)throw error;
      all=all.concat(data||[]);
      if(!data||data.length<page)break;
      from+=page;
    }
    PRODUCTS=all.filter(p=>(unitPrice(p)>0||packPrice(p)>0||boxPrice(p)>0)&&!isHiddenCat(p.category));
    PMAP={};PRODUCTS.forEach(p=>{if(p.barcode)PMAP[p.barcode]=p;});
    const set=new Set();PRODUCTS.forEach(p=>{if(p.category)set.add(p.category);});
    CATS=Array.from(set).sort();
    catalogError='';
    return true;
  }catch(e){
    const msg=(e&&(e.message||e.error_description||e.hint))||(typeof e==='object'?JSON.stringify(e):String(e));
    console.warn('catalog load failed (attempt '+attempt+'):',msg,e);
    if(attempt<3){await new Promise(r=>setTimeout(r,600*attempt));return loadCatalog(attempt+1);}
    catalogError=msg;PRODUCTS=[];CATS=[];
    return false;
  }
}

  catalogError='';PRODUCTS=[];

  render();
}

// โหลดสต็อก POS ของสาขาคลัง (เช็คสินค้าหมด) — ต้องโหลด SHOP_QR ก่อน (STOCK_BRANCH)
async function loadStock(){
  STOCK={};
  if(!STOCK_BRANCH||!STOCK_BRANCH.length)return;
  try{
    const bcs=[...new Set(PRODUCTS.map(p=>String(p.barcode)).filter(Boolean))];
    for(const brId of STOCK_BRANCH){
      for(let i=0;i<bcs.length;i+=300){
        const {data}=await sb.from('products').select('barcode,pos_qty').eq('branch_id',brId).eq('is_active',true).in('barcode',bcs.slice(i,i+300));
        (data||[]).forEach(p=>{const k=String(p.barcode);STOCK[k]=(Number(STOCK[k])||0)+(Number(p.pos_qty)||0);});
      }
    }
  }catch(e){STOCK={};}
}
// สินค้าหมด? (มีสาขาคลัง + เจอสต็อกรวมทุกสาขา ≤ 0) · ไม่ตั้งสาขาคลัง = ไม่เช็ค (ถือว่ามีของ)
function isOutOfStock(bc){ if(!STOCK_BRANCH||!STOCK_BRANCH.length)return false; return STOCK.hasOwnProperty(bc) && (Number(STOCK[bc])||0)<=0; }
// โชว์สต๊อกเมื่อ: พนักงานล็อกอิน หรือ ตั้งค่าเปิดให้ลูกค้า · ต้องตั้งสาขาคลังไว้ก่อน
function showStock(){ return (!!STAFF||SHOW_STOCK_CUST) && STOCK_BRANCH && STOCK_BRANCH.length>0; }

async function staffHash(pwd){const d=new TextEncoder().encode(pwd+STAFF_SALT);const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

async function doStaffLogin(){

    STAFF={username:data.username||u,name:data.full_name||data.username||u,role:data.role||''};

// normalize สำหรับค้นหา: ตัดวรรณยุกต์/ไม้ไทย-ลาว (คนมักพิมพ์ผิดตรงนี้) + ยุบช่องว่าง
function _norm(s){return String(s==null?'':s).toLowerCase().replace(/[\u0E48-\u0E4E\u0E31\u0EB1\u0EC8-\u0ECD]/g,'').replace(/\s+/g,' ').trim();}
// Levenshtein แบบมีเพดาน (early-exit เกิน max = เร็ว) — วัดความต่างของคำ กันพิมพ์ผิด
function _lev(a,b,max){
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>max)return max+1;
  let prev=new Array(lb+1);for(let j=0;j<=lb;j++)prev[j]=j;
  for(let i=1;i<=la;i++){
    const cur=new Array(lb+1);cur[0]=i;let rowMin=cur[0];const ca=a.charCodeAt(i-1);
    for(let j=1;j<=lb;j++){
      const cost=ca===b.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      if(cur[j]<rowMin)rowMin=cur[j];
    }
    if(rowMin>max)return max+1;
    prev=cur;
  }
  return prev[lb];
}
function filteredProducts(){
  let list=PRODUCTS;
  if(curCat==='__FAV__')list=list.filter(p=>isFav(p.barcode));
  else if(curCat==='__PROMO__')list=list.filter(p=>unitWas(p)||(Number(p.pack_promo)>0)||(Number(p.box_promo)>0));
  else if(curCat!=='ALL')list=list.filter(p=>p.category===curCat);
  if(curGroup&&curCat!=='ALL'&&curCat!=='__FAV__'&&curCat!=='__PROMO__')list=list.filter(p=>(p.product_group||'')===curGroup);
  if(curSearch.trim()){
    const raw=curSearch.trim().toLowerCase();
    const nq=_norm(raw);const nqns=nq.replace(/ /g,'');
    // 1) ตรงตัว/บางส่วน (ดีสุด) — ชื่อ/ชื่อแบบตัดเว้นวรรค (พิมพ์ติดกัน)/บาร์โค้ด/หมวด
    const exact=list.filter(p=>{
      const nn=p._nm||(p._nm=_norm(p.product_name));
      return nn.includes(nq)||(nqns&&nn.replace(/ /g,'').includes(nqns))||(p.barcode||'').includes(raw)||_norm(p.category).includes(nq);
    });
    // 2) เสริมคำใกล้เคียง (กันพิมพ์ผิด) — เทียบ edit distance ต่อคำในชื่อ · ทำเมื่อคำยาวพอ + ตรงตัวยังไม่มาก
    if(nq.length>=2 && exact.length<25){
      const tol=nq.length<=4?1:(nq.length<=7?2:3);
      const seen=new Set(exact.map(p=>p.barcode));
      const near=[];
      for(const p of list){
        if(seen.has(p.barcode))continue;
        const nn=p._nm||(p._nm=_norm(p.product_name));
        let best=99;
        const words=nn.split(' ');
        for(const w of words){
          if(!w||Math.abs(w.length-nq.length)>tol)continue;
          const d=_lev(nq,w,tol);
          if(d<best)best=d;
          if(best===0)break;
        }
        if(best<=tol)near.push([p,best]);
      }
      near.sort((a,b)=>a[1]-b[1]);
      return exact.concat(near.map(x=>x[0]));
    }
    return exact;
  }
  return list;
}

function loadMore(shown,total){

  // ปุ่มนี้เป็น fallback — ปกติ IntersectionObserver จะกดให้เองตอนเลื่อนใกล้ถึง (armInfiniteScroll)

}

  PAGE++;

  if(view==='promo'){const b=$('promoBody');if(b){b.innerHTML=promoBody(promoActiveCampaigns());armInfiniteScroll();return;}}  // อัปเดตแค่ body ไม่แตะ hero carousel

// โหลดเพิ่มอัตโนมัติเมื่อเลื่อนใกล้ถึงปุ่ม (infinite scroll) — rootMargin เผื่อ 320px ให้ลื่น
let _io=null;
function armInfiniteScroll(){
  if(_io){_io.disconnect();_io=null;}
  if(!('IntersectionObserver' in window))return;
  const btn=$('loadMoreBtn');if(!btn)return;
  _io=new IntersectionObserver((ents)=>{ if(ents[0]&&ents[0].isIntersecting)loadMoreNow(); },{rootMargin:'320px'});
  _io.observe(btn);
}

function promoLimitBar(p){

// ค้นหาจากรูป — อ่านบาร์โค้ดจากรูปถ่าย (BarcodeDetector)
async function scanImageSearch(input){
  const f=input.files&&input.files[0];if(input)input.value='';if(!f)return;
  if(!('BarcodeDetector' in window)){toast(isLao()?'ອຸປະກອນບໍ່ຮອງຮັບການສະແກນຮູບ (ໃຊ້ Chrome ມືຖື)':'อุปกรณ์ไม่รองรับสแกนจากรูป (ใช้ Chrome มือถือ)','warn');return;}

    const det=new BarcodeDetector();

      onSearch(code);return;
    }
    toast(isLao()?'ບໍ່ພົບບາໂຄດ ລອງຖ່າຍໃໝ່ໃຫ້ຊັດ':'ไม่พบบาร์โค้ด ลองถ่ายใหม่ให้ชัด','warn');
  }catch(e){toast(isLao()?'ອ່ານຮູບບໍ່ໄດ້':'อ่านรูปไม่ได้','warn');}
}

function promoProducts(){
  return PRODUCTS.filter(p=>unitWas(p)>0||(Number(p.pack_promo)>0&&Number(p.pack_normal)>Number(p.pack_promo))||(Number(p.box_promo)>0&&Number(p.box_normal)>Number(p.box_promo)));

// %ส่วนลดสูงสุดของสินค้า (ชิ้น/แพ็ค/ลัง) — ใช้เรียงลำดับ
function discPct(p){
  let d=0;const u=unitWas(p);if(u>0)d=Math.max(d,1-unitPrice(p)/u);
  if(Number(p.pack_promo)>0&&Number(p.pack_normal)>Number(p.pack_promo))d=Math.max(d,1-Number(p.pack_promo)/Number(p.pack_normal));
  if(Number(p.box_promo)>0&&Number(p.box_normal)>Number(p.box_promo))d=Math.max(d,1-Number(p.box_promo)/Number(p.box_normal));
  return d;
}
// จำนวนเงินที่ประหยัด (ปกติ−โปร) สูงสุดของสินค้า (ชิ้น/แพ็ค/ลัง)
function discAmount(p){
  let d=0;const uw=unitWas(p);if(uw>0)d=Math.max(d,uw-unitPrice(p));
  if(Number(p.pack_promo)>0&&Number(p.pack_normal)>Number(p.pack_promo))d=Math.max(d,Number(p.pack_normal)-Number(p.pack_promo));
  if(Number(p.box_promo)>0&&Number(p.box_normal)>Number(p.box_promo))d=Math.max(d,Number(p.box_normal)-Number(p.box_promo));
  return d;
}
function promoSortVal(p){return promoSort==='amt'?discAmount(p):discPct(p);}

// จัดกลุ่มสินค้าโปรฯ ตามประเภท · เรียงส่วนลดมาก→น้อย · แบ่งหน้า (limit = PAGE*PER_PAGE) กันมือถือค้าง
function promoGroupedPaged(items){
  const by={};items.forEach(p=>{const c=p.category||'__x';(by[c]=by[c]||[]).push(p);});
  const cats=Object.keys(by).sort((a,b)=>{const ia=CATS.indexOf(a),ib=CATS.indexOf(b);return (ia<0?9999:ia)-(ib<0?9999:ib);});
  const limit=PAGE*PER_PAGE;let shown=0;let html='';
  for(const c of cats){
    if(shown>=limit)break;
    const arr=by[c].slice().sort((x,y)=>promoSortVal(y)-promoSortVal(x));
    const take=arr.slice(0,Math.max(0,limit-shown));
    if(!take.length)continue;
    html+=`<div class="promo-cat"><div class="promo-cat-h">${catIcon(c)} ${esc(catLabel(c))} <span>(${arr.length})</span></div><div class="grid">${take.map(pcard).join('')}</div></div>`;
    shown+=take.length;
  }
  return html+loadMore(shown,items.length);
}
// แถวเลื่อนแนวนอนต่อแคมเปญ (หน้ารวมโปรฯ) + ดูทั้งหมด → เปิดแคมเปญนั้น
function promoRow(pr,items){
  const sorted=items.slice().sort((x,y)=>promoSortVal(y)-promoSortVal(x));
  const shown=sorted.slice(0,10);const more=items.length>shown.length;
  const pc=colorSafe(pr.badge_color);
  return `<div class="home-sec">

    <div class="hrow">${shown.map(pcard).join('')}${more?`<button class="hrow-more" onclick="selPromo('${esc(pr.id)}')">${svg(IC.chevR)}<span>${isLao()?'ເບິ່ງທັງໝົດ':'ดูทั้งหมด'}</span></button>`:''}</div>
  </div>`;
}

// hero carousel: สไลด์ [ทั้งหมด, โปร1, โปร2, ...] เลื่อนซ้าย-ขวา → เปลี่ยน curPromo + สินค้าเปลี่ยนตาม
function promoHeroCarousel(campaigns){

  return `<div class="phero"><div class="phero-track" id="pheroTrack" onscroll="promoHeroScroll()">${slideHtml}</div>${arrows}${timer}<div class="phero-dots">${dots}</div></div>`;

function relatedProducts(p){
  let r=PRODUCTS.filter(x=>x.barcode!==p.barcode&&p.category&&x.category===p.category);
  if(r.length<4&&p.product_group){
    const seen=new Set(r.map(x=>x.barcode));
    r=r.concat(PRODUCTS.filter(x=>x.barcode!==p.barcode&&x.product_group&&x.product_group===p.product_group&&!seen.has(x.barcode)));
  }
  return r.slice(0,12);
}

}

/* ---------- Cart ops ---------- */
function addToCart(bc,ut,qty){
  if(isOutOfStock(bc)){toast(isLao()?'ສິນຄ້າໝົດ':'สินค้าหมด','warn');return;}
  const ex=cart.find(i=>i.barcode===bc&&i.unit_type===ut);
  if(ex)ex.qty+=qty;else cart.push({barcode:bc,unit_type:ut,qty:qty});
  saveCart();
}
function quickAdd(bc){addToCart(bc,'unit',1);toast(T('added'),'ok');if(view==='home'||view==='promo')render();}
function chgQty(bc,ut,d){
  const ex=cart.find(i=>i.barcode===bc&&i.unit_type===ut);if(!ex)return;
  ex.qty+=d;if(ex.qty<=0)cart=cart.filter(i=>!(i.barcode===bc&&i.unit_type===ut));
  saveCart();render();
}
function removeItem(bc,ut){cart=cart.filter(i=>!(i.barcode===bc&&i.unit_type===ut));saveCart();render();}
function cartSubtotal(){return cart.reduce((s,i)=>{const p=PMAP[i.barcode];if(!p)return s;return s+priceFor(p,i.unit_type)*i.qty;},0);}

async function placeOrder(){
  const btn=$('coBtn');if(btn){btn.disabled=true;btn.textContent=T('ordering');}
  const items=cart.map(i=>({barcode:i.barcode,unit_type:i.unit_type,qty:i.qty}));
  let addr=null,branch=null;
  if(coFulfill==='delivery'){addr=($('coAddr')||{}).value||'';if(!addr.trim()){toast(T('reqfields'),'warn');if(btn){btn.disabled=false;btn.textContent=T('placeorder');}return;}}
  else{branch=($('coBranch')||{}).value||null;branch=branch?parseInt(branch):null;}
  const payStore=(coFulfill==='pickup'&&coPay==='store');
  let note=($('coNote')||{}).value||'';
  if(payStore)note=T('paystoretag')+(note?('\n'+note):'');   // มาร์กให้พนักงานเห็นว่าเก็บเงินที่สาขา
  try{
    const base={p_token:token,p_items:items,p_fulfillment:coFulfill,p_address:addr,p_branch_id:branch,p_note:note};
    let {data,error}=await sb.rpc('rpc_store_place_order',payStore?{...base,p_pay_method:'store'}:base);
    if(error&&payStore&&/could not find the function|schema cache|PGRST202/i.test((error.message||'')+' '+(error.code||''))){
      ({data,error}=await sb.rpc('rpc_store_place_order',base));  // RPC ยังไม่มี p_pay_method → note marker แจ้งพนักงานแทน
    }
    if(error||!data||!data.ok){toast((data&&data.error)||'error','err');if(btn){btn.disabled=false;btn.textContent=T('placeorder');}return;}
    cart=[];saveCart();
    if(payStore)openStoreSuccess(data); else openPayment(data);
  }catch(e){toast(String(e.message||e),'err');if(btn){btn.disabled=false;btn.textContent=T('placeorder');}}
}

let slipBlob=null;
async function onSlip(input,orderId){
  const f=input.files&&input.files[0];if(!f)return;
  const drop=$('slipDrop'),txt=$('slipTxt');
  if(drop)drop.style.pointerEvents='none';if(txt)txt.textContent=T('uploading');
  try{
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${orderId}_${Date.now()}.${ext}`;
    const {error:upErr}=await sb.storage.from('store-slips').upload(path,f,{upsert:true,contentType:f.type});
    if(upErr)throw upErr;
    const {data:pub}=sb.storage.from('store-slips').getPublicUrl(path);
    const url=pub.publicUrl;
    const {data,error}=await sb.rpc('rpc_store_attach_slip',{p_token:token,p_order_id:orderId,p_slip_url:url});
    if(error||!data||!data.ok)throw new Error((data&&data.error)||'attach failed');
    closeSheet();openSuccess();
  }catch(e){
    toast(String(e.message||e),'err');
    if(drop)drop.style.pointerEvents='';if(txt)txt.textContent=T('slipdrop');
  }
}

    <button class="btn btn-o" style="color:var(--red)" onclick="doLogout()">${esc(T('logout'))}</button>
    ${staffSection()}
  </div>`;
}
function staffAccountRow(){
  if(STAFF){
    return `<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center">${svg(IC.pkg,2)}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13.5px">${isLao()?'ພະນັກງານ':'พนักงาน'}: ${esc(STAFF.name)}</div>
      <div style="font-size:11.5px;color:var(--green-d)">${isLao()?'ເບິ່ງສະຕັອກສິນຄ້າໄດ້':'ดูสต๊อกสินค้าได้'} ✓</div></div>
      <button class="btn btn-o" style="width:auto;padding:0 14px;height:36px" onclick="staffLogout()">${isLao()?'ອອກ':'ออก'}</button>
    </div>`;
  }
  return `<button class="btn btn-o" onclick="openStaffLogin()">${svg(IC.pkg)}${isLao()?'ເຂົ້າລະບົບພະນັກງານ (ເບິ່ງສະຕັອກ)':'เข้าระบบพนักงาน (ดูสต๊อก)'}</button>`;
}
// ส่วน "เฉพาะเจ้าหน้าที่" — แยกออกจากบัญชีลูกค้าให้ชัด (ลูกค้าทั่วไปไม่ต้องยุ่ง)
function staffSection(){
  const title=isLao()?'ສະເພາະເຈົ້າໜ້າທີ່':'เฉพาะเจ้าหน้าที่';
  return `<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:14px">
    <div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-align:center;margin-bottom:10px">— ${esc(title)} —</div>
    ${staffAccountRow()}
  </div>`;
}
// แก้ไขข้อมูลบัญชีลูกค้า (ชื่อ / ประเภทกิจการ) — เบอร์โทร = ไอดีเข้าระบบ แก้ไม่ได้เอง
function openEditProfile(){
  if(!token||!profile){toast(T('needlogin'),'warn');return;}
  const lo=isLao();
  openSheet(`<div class="sheet-h"><h3>${lo?'ແກ້ໄຂຂໍ້ມູນບັນຊີ':'แก้ไขข้อมูลบัญชี'}</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-b">
      <div class="field"><label>${esc(T('phone'))}</label><input value="${esc(profile.phone||'')}" disabled style="opacity:.6"><div style="font-size:11px;color:var(--muted);margin-top:4px">${lo?'ເບີໂທ = ໄອດີເຂົ້າລະບົບ ປ່ຽນເອງບໍ່ໄດ້ (ຕິດຕໍ່ພະນັກງານ)':'เบอร์โทร = ไอดีเข้าระบบ เปลี่ยนเองไม่ได้ (ติดต่อพนักงาน)'}</div></div>
      <div class="field"><label>${esc(T('name'))}</label><input id="epName" value="${esc(profile.name||'')}" placeholder="${esc(T('name'))}"></div>
      <div class="field"><label>${esc(T('biztype'))}</label><input id="epBiz" value="${esc(profile.business_type||'')}" placeholder="${esc(T('biztypeph'))}"></div>
      <button class="btn btn-g" id="epBtn" onclick="submitEditProfile()">${lo?'ບັນທຶກ':'บันทึก'}</button>
    </div>`);
}
async function submitEditProfile(){
  const name=($('epName')||{}).value||'';const biz=($('epBiz')||{}).value||'';
  if(!name.trim()){toast(T('reqfields'),'warn');return;}
  const btn=$('epBtn');if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    const {data,error}=await sb.rpc('rpc_store_update_profile',{p_token:token,p_name:name,p_business:biz});
    if(error||!data||!data.ok)throw new Error((data&&data.error)||(error&&error.message)||'failed');
    await restoreSession();
    closeSheet();toast(isLao()?'ບັນທຶກແລ້ວ':'บันทึกแล้ว','ok');go('account');
  }catch(e){toast(String(e.message||e),'err');if(btn){btn.disabled=false;btn.textContent=isLao()?'ບັນທຶກ':'บันทึก';}}
}
// เปลี่ยนรหัสผ่าน (ต้องกรอกรหัสเดิม)
function openChangePw(){
  if(!token||!profile){toast(T('needlogin'),'warn');return;}
  const lo=isLao();
  openSheet(`<div class="sheet-h"><h3>${lo?'ປ່ຽນລະຫັດຜ່ານ':'เปลี่ยนรหัสผ่าน'}</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-b">
      <div class="field"><label>${lo?'ລະຫັດຜ່ານເດີມ':'รหัสผ่านเดิม'}</label><input id="cpOld" type="password" placeholder="••••••"></div>
      <div class="field"><label>${lo?'ລະຫັດຜ່ານໃໝ່':'รหัสผ่านใหม่'}</label><input id="cpNew" type="password" placeholder="${lo?'ຢ່າງໜ້ອຍ 4 ຕົວ':'อย่างน้อย 4 ตัว'}"></div>
      <div class="field"><label>${lo?'ຢືນຢັນລະຫັດຜ່ານໃໝ່':'ยืนยันรหัสผ่านใหม่'}</label><input id="cpNew2" type="password" placeholder="••••••"></div>
      <button class="btn btn-g" id="cpBtn" onclick="submitChangePw()">${lo?'ບັນທຶກ':'บันทึก'}</button>
    </div>`);
}
async function submitChangePw(){
  const lo=isLao();
  const oldp=($('cpOld')||{}).value||'';const np=($('cpNew')||{}).value||'';const np2=($('cpNew2')||{}).value||'';
  if(!oldp||!np){toast(T('reqfields'),'warn');return;}
  if(np.length<4){toast(lo?'ລະຫັດຜ່ານໃໝ່ຢ່າງໜ້ອຍ 4 ຕົວ':'รหัสผ่านใหม่อย่างน้อย 4 ตัว','warn');return;}
  if(np!==np2){toast(lo?'ລະຫັດຜ່ານໃໝ່ບໍ່ກົງກັນ':'รหัสผ่านใหม่ไม่ตรงกัน','warn');return;}
  const btn=$('cpBtn');if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    const {data,error}=await sb.rpc('rpc_store_change_password',{p_token:token,p_old:oldp,p_new:np});
    if(error||!data||!data.ok){
      const em=(data&&data.error)||'';
      if(em==='wrong_password'){toast(lo?'ລະຫັດຜ່ານເດີມບໍ່ຖືກຕ້ອງ':'รหัสผ่านเดิมไม่ถูกต้อง','err');if(btn){btn.disabled=false;btn.textContent=lo?'ບັນທຶກ':'บันทึก';}return;}
      throw new Error(em||(error&&error.message)||'failed');
    }
    closeSheet();toast(lo?'ປ່ຽນລະຫັດຜ່ານແລ້ວ':'เปลี่ยนรหัสผ่านแล้ว','ok');
  }catch(e){toast(String(e.message||e),'err');if(btn){btn.disabled=false;btn.textContent=lo?'ບັນທຶກ':'บันทึก';}}
}

/* ---------- Auth ---------- */
let authTab='login';
function openAuth(tab){
  authTab=tab||'login';
  renderAuthSheet();
}
function renderAuthSheet(){
  const html=`
    <div class="sheet-h"><h3>${esc(authTab==='login'?T('login'):T('register'))}</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-b">
      <div class="tabs">
        <button class="${authTab==='login'?'on':''}" onclick="switchAuth('login')">${esc(T('signin'))}</button>
        <button class="${authTab==='register'?'on':''}" onclick="switchAuth('register')">${esc(T('signup'))}</button>
      </div>
      <div class="field"><label>${esc(T('phone'))}</label><input id="auPhone" type="tel" inputmode="tel" placeholder="020 xxxx xxxx"></div>
      ${authTab==='register'?`<div class="field"><label>${esc(T('name'))}</label><input id="auName" placeholder="${esc(T('name'))}"></div>
        <div class="field"><label>${esc(T('biztype'))}</label><input id="auBiz" placeholder="${esc(T('biztypeph'))}"></div>`:''}
      <div class="field"><label>${esc(T('password'))}</label><input id="auPass" type="password" placeholder="••••••"></div>
      <button class="btn btn-g" id="auBtn" onclick="submitAuth()">${esc(authTab==='login'?T('signin'):T('signup'))}</button>
      ${authTab==='login'?`<div style="text-align:center;margin-top:12px"><a onclick="forgotPw()" style="font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer">${isLao()?'ລືມລະຫັດຜ່ານ?':'ลืมรหัสผ่าน?'}</a></div>`:''}
    </div>`;
  openSheet(html);
}
function switchAuth(t){authTab=t;renderAuthSheet();}
// ลืมรหัสผ่าน — ไม่มี email/SMS → ให้ติดต่อพนักงานร้านรีเซ็ตให้ (พนักงานตั้งรหัสชั่วคราวในคอนโซล)
function forgotPw(){
  const lo=isLao();
  openSheet(`<div class="sheet-h"><h3>${lo?'ລືມລະຫັດຜ່ານ':'ลืมรหัสผ่าน'}</h3><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="sheet-b" style="text-align:center;padding:24px 22px 28px">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin:0 auto 16px">${svg(IC.lock,2)}</div>
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">${lo?'ຕິດຕໍ່ພະນັກງານຮ້ານ':'ติดต่อพนักงานร้าน'}</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">${lo?'ແຈ້ງເບີໂທທີ່ໃຊ້ສະໝັກ ພະນັກງານຈະຕັ້ງລະຫັດຊົ່ວຄາວໃຫ້ ແລ້ວທ່ານເຂົ້າລະບົບ ໄປປ່ຽນລະຫັດເອງພາຍຫຼັງໄດ້':'แจ้งเบอร์โทรที่ใช้สมัคร พนักงานจะตั้งรหัสชั่วคราวให้ แล้วท่านล็อกอินเข้าไปเปลี่ยนรหัสเองภายหลังได้'}</div>
      <button class="btn btn-g" style="margin-top:22px" onclick="closeSheet()">${lo?'ຮັບຊາບ':'รับทราบ'}</button>
    </div>`);
}
async function submitAuth(){
  const phone=($('auPhone')||{}).value||'';const pass=($('auPass')||{}).value||'';
  if(!phone.trim()||!pass.trim()){toast(T('reqfields'),'warn');return;}
  const btn=$('auBtn');btn.disabled=true;
  try{
    if(authTab==='register'){
      const name=($('auName')||{}).value||'';const biz=($('auBiz')||{}).value||'';
      const {data,error}=await sb.rpc('rpc_store_register',{p_phone:phone,p_password:pass,p_name:name,p_business:biz});
      if(error||!data){toast('error','err');btn.disabled=false;return;}
      if(!data.ok){toast(data.error==='phone_exists'?T('regphoneexist'):data.error,'err');btn.disabled=false;return;}
      closeSheet();openPending();
    }else{
      const {data,error}=await sb.rpc('rpc_store_login',{p_phone:phone,p_password:pass});
      if(error||!data){toast('error','err');btn.disabled=false;return;}
      if(!data.ok){
        if(data.error==='pending'){closeSheet();openPending();return;}
        toast(T('loginfail'),'err');btn.disabled=false;return;
      }
      token=data.token;profile=data.profile;localStorage.setItem('fs_store_token',token);
      closeSheet();toast(T('welcome')+' '+(profile.name||''),'ok');
      render();
    }
  }catch(e){toast(String(e.message||e),'err');btn.disabled=false;}
}
function openPending(){
  openSheet(`<div class="sheet-b" style="text-align:center;padding:34px 24px 28px">
    <div style="font-size:44px;margin-bottom:10px">⏳</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:8px">${esc(T('pendingtitle'))}</div>
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:22px;line-height:1.6">${esc(T('pendingmsg'))}</div>
    <button class="btn btn-g" onclick="closeSheet()">${esc(T('close'))}</button>
  </div>`);
}
async function doLogout(){
  try{await sb.rpc('rpc_store_logout',{p_token:token});}catch(e){}
  token=null;profile=null;localStorage.removeItem('fs_store_token');
  toast(T('logout'),'ok');go('home');
}

/* ---------- Shared page chrome ---------- */
function pageHead(title,back){
  return `<div class="page-h"><button class="back" onclick="go('${back}')">${svg(IC.back)}</button><h2>${esc(title)}</h2></div>`;
}
function simplePage(title,body){return `${pageHead(title,'home')}<div class="wrap">${body}</div>`;}
function bottomNav(){
  const b=(v,ic,lb,badge)=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${svg(ic)}${badge?`<span class="nb" data-cartbadge style="display:none">0</span>`:''}<span>${esc(lb)}</span></button>`;
  return `<nav class="bn">
    ${b('home',IC.home,T('home'),false)}
    ${b('promo',IC.bolt,T('promo'),false)}
    ${b('cart',IC.cart,T('cart'),true)}
    ${b('orders',IC.bag,T('orders'),false)}
    ${b('account',IC.user,T('account'),false)}
  </nav>`;
}

/* ---------- Sheet ---------- */
function openSheet(html,noClose){$('sheet').innerHTML=html;$('ov').classList.add('show');document.body.style.overflow='hidden';}
function closeSheet(){$('ov').classList.remove('show');document.body.style.overflow='';}

/* ============================================================
   Boot
   ============================================================ */
async function boot(){
  document.documentElement.lang=lang==='lo'?'lo':'th';
  restoreStaff();
  $('app').innerHTML=header(true)+catBar()+`<div class="wrap"><div class="grid">${'<div class="skel"></div>'.repeat(8)}</div></div>`+bottomNav();
  await loadCatalog();          // โหลดสินค้าก่อน (มี retry ในตัว) — ไม่ให้ query อื่นบล็อก
  render();
  Promise.all([loadBranches(),loadPromos(),loadLabels(),loadStorePages(),restoreSession(),loadShopQR().then(loadStock)]).then(()=>render());  // พื้นหลัง: สาขา/โปร/ป้าย/หน้าข้อมูล/session/QR+สต็อกคลัง → re-render
}
boot();
</script>
</body>
</html>
